name: QA Chromium (non-deploy)
on:
  push:
    branches:
      - test/calculator-validation-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Select non-Snap Chrome/Chromium
        run: |
          set -euo pipefail
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome /usr/bin/chromium; do
            if [ -x "$candidate" ] && ! readlink -f "$candidate" | grep -q '/snap/'; then
              echo "CHROMIUM=$candidate" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          echo 'No non-Snap Chrome binary available on runner' >&2
          exit 1
      - name: Run existing real-DOM QA
        run: |
          set -o pipefail
          node qa/browser-smoke.mjs 2>&1 | tee chromium-qa.log
      - name: Preserve raw QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-qa-log
          path: chromium-qa.log
          if-no-files-found: warn

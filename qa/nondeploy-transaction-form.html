<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쓸모산책 거래 입력 UX 비배포 시제품</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182b25;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:24px}header{margin-bottom:24px}h1{font-size:clamp(1.4rem,3vw,2rem)}.note{color:#52645c}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.panel{background:white;border:1px solid #d9e3dc;border-radius:18px;padding:22px;min-width:0}label{display:block;font-weight:650;margin:15px 0 6px}input,select,button{font:inherit;width:100%;min-height:48px;border-radius:10px;padding:10px 12px}input,select{border:1px solid #9eafa4;background:#fff}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #256b4a;outline-offset:2px}button{border:0;background:#166b49;color:#fff;font-weight:700;margin-top:20px;cursor:pointer}.error{color:#b42318;min-height:24px}ul{padding-left:20px}li{margin:10px 0;overflow-wrap:anywhere}.muted{color:#53675c}.amount{font-size:1.6rem;font-weight:800}.pill{display:inline-block;background:#e8f3ec;padding:4px 10px;border-radius:20px;font-size:.85rem}@media(max-width:700px){.wrap{padding:14px}.layout{grid-template-columns:1fr}.panel{padding:18px}input,select,button{font-size:16px}}
</style></head><body><main class="wrap"><header><span class="pill">비배포 · 가상 데이터 전용</span><h1>거래 입력</h1><p class="note">분류를 선택하고 메모와 금액을 입력한 뒤 저장하세요. 이 화면은 Google Sheets와 연결되지 않습니다.</p></header>
<div class="layout"><section class="panel" aria-labelledby="entry-title"><h2 id="entry-title">새 거래</h2><form id="entry" novalidate><label for="category">분류 (필수)</label><select id="category" required><option value="">선택해 주세요</option><option>식비</option><option>교통</option><option>생활</option><option>기타</option></select><label for="memo">메모 (선택)</label><input id="memo" maxlength="80" placeholder="예: 점심 식사"><label for="amount">금액 (원, 필수)</label><input id="amount" inputmode="numeric" type="number" min="1" max="1000000000" step="1" placeholder="예: 12000" required><p class="error" id="error" role="alert" aria-live="assertive"></p><button type="submit">거래 저장</button></form></section>
<section class="panel" aria-labelledby="summary-title"><h2 id="summary-title">이번 시연 합계</h2><p class="amount" id="total" aria-live="polite">0원</p><p class="muted" id="count">0건</p><h3>최근 거래</h3><ul id="transactions" aria-live="polite"><li>아직 거래가 없습니다.</li></ul></section></div></main>
<script>
(()=>{'use strict';const form=document.querySelector('#entry'),category=document.querySelector('#category'),memo=document.querySelector('#memo'),amount=document.querySelector('#amount'),error=document.querySelector('#error'),total=document.querySelector('#total'),count=document.querySelector('#count'),list=document.querySelector('#transactions');const entries=[];const money=n=>n.toLocaleString('ko-KR')+'원';form.addEventListener('submit',e=>{e.preventDefault();error.textContent='';const n=Number(amount.value);if(!category.value){error.textContent='분류를 선택해 주세요.';category.focus();return}if(!amount.value||!Number.isSafeInteger(n)||n<1||n>1000000000){error.textContent='금액은 1원 이상 10억 원 이하의 정수로 입력해 주세요.';amount.focus();return}entries.unshift({category:category.value,memo:memo.value.trim(),amount:n});total.textContent=money(entries.reduce((s,x)=>s+x.amount,0));count.textContent=entries.length+'건';list.replaceChildren();entries.slice(0,5).forEach(x=>{const li=document.createElement('li');li.textContent=x.category+' · '+(x.memo||'메모 없음')+' · '+money(x.amount);list.append(li)});form.reset();category.focus()});})();
</script></body></html>
